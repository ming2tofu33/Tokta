<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Tokta 디자인 v2 — B+C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ececf0;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo",sans-serif;color:#1d1d1f;padding:32px 40px 80px}
h1{font-size:22px;margin-bottom:6px}.lead{color:#666;font-size:14px;margin-bottom:24px;max-width:900px;line-height:1.5}
h2{font-size:16px;margin:36px 0 12px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:"New York","Iowan Old Style",Georgia,serif}
.T{--ink:#1d1d1f;--dim:#86868b;--line:#0000000f;--card:#fff;--glass:rgba(255,255,255,.74);--acc:#5b5fe0;--warn:#e07a3a;--bad:#d9434a;--track:#0000000d}
.T.dark{--ink:#f2f2f5;--dim:#9a9aa3;--line:#ffffff12;--card:#2a2a30;--glass:rgba(38,38,44,.78);--acc:#8b8ff8;--warn:#f59152;--bad:#f2555a;--track:#ffffff14}
.stage{background:linear-gradient(135deg,#c9d6ff 0%,#e2c9f5 50%,#ffd9c2 100%);padding:28px;border-radius:18px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.stage.dk{background:linear-gradient(135deg,#1e2140 0%,#2d1f3a 50%,#3a2620 100%)}
.menu{width:380px;background:var(--glass);backdrop-filter:blur(30px);border-radius:16px;box-shadow:0 20px 60px #0003;border:1px solid #fff5;overflow:hidden;color:var(--ink)}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-size:12px;color:var(--dim)}
.mtop b{color:var(--ink);font-size:14px}
.say{padding:8px 18px 12px;font-size:19px;line-height:1.3}
.say em{font-style:normal;color:var(--acc)}.say .w{color:var(--warn)}
.hero{margin:0 12px;background:var(--card);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 3px #0001}
.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring .in{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:18px}
.tag{font-size:11px;color:var(--acc);font-weight:600}
.who{font-size:16px;font-weight:700;margin-top:2px}.who i{font-style:normal;font-weight:500;color:var(--dim);font-size:13px;margin-left:4px}
.sub{font-size:12px;color:var(--dim);margin-top:3px}
.btn{display:inline-block;margin-top:9px;background:var(--acc);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px}
.sec{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:14px 18px 2px;font-weight:600}
.acc{display:grid;grid-template-columns:22px 1fr 64px 40px 12px;gap:10px;align-items:center;padding:7px 18px;font-size:13px}
.dot{width:22px;height:22px;border-radius:7px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.acc i{font-style:normal;color:var(--dim);font-size:11px;margin-left:4px}
.pct{text-align:right;font-weight:600}.chev{color:var(--dim);font-size:12px}
.foot{display:flex;justify-content:space-between;padding:12px 18px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);margin-top:8px}
.foot b{color:var(--ink);font-weight:600}
.win{width:760px;background:var(--glass);backdrop-filter:blur(30px);border-radius:14px;box-shadow:0 20px 60px #0003;overflow:hidden;border:1px solid #fff5;color:var(--ink)}
.tb{height:46px;display:flex;align-items:center;gap:7px;padding:0 14px;font-size:13px;font-weight:600}
.tb s{width:12px;height:12px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:2px;margin:0 auto;background:var(--track);border-radius:8px;padding:2px}
.tabs span{font-size:12px;padding:4px 14px;border-radius:6px;color:var(--dim);font-weight:500}.tabs .sel{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0001}
.wm{padding:4px 22px 22px}
.k{font-size:11px;color:var(--dim);font-weight:600}
.headline{font-size:27px;line-height:1.28;margin:6px 0 16px;font-weight:600}
.headline em{font-style:normal;color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px #0001}
.kpi .l{font-size:12px;color:var(--dim)}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .s{font-size:11px;color:var(--dim);margin-top:2px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.box{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px #0001}
.box h4{font-size:13px;margin-bottom:8px}
.vrow{display:grid;grid-template-columns:22px 1fr 70px 46px;gap:10px;align-items:center;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .m{color:var(--dim);font-size:11px}
.note{font-size:12.5px;line-height:1.5;padding:9px 0 9px 12px;border-left:2px solid var(--acc);margin-bottom:8px}
.note.w{border-color:var(--warn)}
.note b{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:2px}
/* 첫 실행 */
.ob{width:560px}
.obm{padding:10px 30px 26px;text-align:center}
.obm .headline{font-size:24px;margin:12px 0 6px}
.obm p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:18px}
.svc{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 3px #0001;font-size:13px}
.svc .dot{width:28px;height:28px;border-radius:8px;font-size:13px}
.svc small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.svc .go{font-size:12px;font-weight:600;color:var(--acc)}.svc .ok{font-size:12px;font-weight:600;color:#2f9e6b}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.steps b{width:24px;height:4px;border-radius:2px;background:var(--track)}.steps b.on{background:var(--acc)}
canvas.px{image-rendering:pixelated}
</style></head><body>
<h1>Tokta 디자인 v2 — B 바탕 + C 문장</h1>
<p class="lead">B의 맥다운 반투명 바탕·링·서비스 색 아이콘에, C처럼 맨 위에서 지금 상태를 <b>한 문장</b>으로 말해주고 계정마다 <b>추이 선</b>을 그렸어요. 제목 문장만 세리프(New York)라 C의 느낌이 살짝 남아요. 숫자는 예시예요.</p>

<h2>메뉴바 메뉴 · 라이트 / 다크</h2>
<div class="stage" id="menus"></div>

<h2>Tokta 창 — 이번 달</h2>
<div class="stage"><div class="win T" id="win"></div></div>

<h2>Tokta 창 — 처음 실행</h2>
<div class="stage"><div class="win T ob" id="ob"></div></div>

<script>
const accs=[
 {svc:'ChatGPT',n:'개인',p:'Pro',r:.96,c:'#10a37f',t:[.6,.55,.5,.42,1,.95,.9,.96]},
 {svc:'ChatGPT',n:'회사',p:'Plus',r:0,c:'#10a37f',t:[.5,.4,.3,.2,.12,.05,.02,0]},
 {svc:'Claude',n:'메인',p:'Max',r:.15,c:'#d97757',t:[1,.8,.6,1,.7,.45,.3,.15]},
 {svc:'Claude',n:'서브',p:'Team',r:.70,c:'#d97757',t:[.9,.88,.85,.8,.78,.75,.72,.70]},
 {svc:'Cursor',n:'Cursor',p:'Pro',r:.35,c:'#1d1d1f',t:[.8,.7,.62,.55,.5,.45,.4,.35]},
 {svc:'Grok',n:'개인',p:'SuperGrok',r:1,c:'#6b6b73',t:[1,1,1,1,1,1,1,1]},
];
const col=r=>r<=.05?'var(--bad)':r<=.2?'var(--warn)':'var(--ink)';
const lineCol=r=>r<=.05?'var(--bad)':r<=.2?'var(--warn)':'var(--acc)';
const spark=a=>`<svg width="64" height="18" viewBox="0 0 64 18"><polyline fill="none" stroke="${lineCol(a.r)}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="${a.t.map((v,i)=>`${2+i*8.6},${16-v*14}`).join(' ')}"/><circle cx="${2+7*8.6}" cy="${16-a.r*14}" r="2" fill="${lineCol(a.r)}"/></svg>`;
function menu(dark){
 let rows='',last='';
 accs.forEach(a=>{rows+=`<div class="acc"><span class="dot" style="background:${a.c}">${a.svc[0]}</span><span>${a.svc==='Cursor'?'Cursor':a.svc+' '+a.n}<i>${a.p}</i></span>${spark(a)}<span class="pct num" style="color:${col(a.r)}">${Math.round(a.r*100)}%</span><span class="chev">›</span></div>`});
 return `<div class="menu T ${dark?'dark':''}">
  <div class="mtop"><b>Tokta</b><span>방금 갱신 · ↻</span></div>
  <div class="say serif">지금은 <em>ChatGPT 개인</em>이 가장 여유 있어요. <span class="w">Claude 메인은 1시간 안에 바닥나요.</span></div>
  <div class="hero">
   <div class="ring" style="background:conic-gradient(var(--acc) 0 96%,var(--track) 96% 100%)"><div class="in num">96%</div></div>
   <div><div class="tag">지금 쓸 계정</div><div class="who">ChatGPT<i>개인 · Pro</i></div><div class="sub">Codex 주간 · 3일 22시간 뒤 리셋</div><span class="btn">Codex 열기 ↗ <span style="opacity:.6;font-weight:500">⌘↩</span></span></div>
  </div>
  <div class="sec"><span>모든 계정</span><span>최근 7일</span></div>
  ${rows}
  <div class="foot"><span>이번 달 <b class="num">₩235,000</b></span><span>Tokta 열기 ⌘O · 설정</span></div>
 </div>`}
document.getElementById('menus').innerHTML=menu(false)+`<div class="stage dk" style="padding:0;background:none">${menu(true)}</div>`;
document.querySelectorAll('.stage')[0].querySelector('.dk').outerHTML; 
// put dark menu on dark bg
const m=document.getElementById('menus');m.style.background='linear-gradient(90deg,#d6dcff 0%,#ecd3f2 50%,#2a2440 50%,#3a2620 100%)';

const vals=[['ChatGPT Pro','#10a37f','₩30,000',.82,'5시간 한도 2번 바닥'],['Claude Max','#d97757','₩137,000',.91,'바닥 5번 · 가장 많이 씀'],['Cursor Pro','#1d1d1f','₩27,000',.64,'적당히 씀'],['SuperGrok','#6b6b73','₩41,000',.04,'2주째 거의 안 씀']];
document.getElementById('win').innerHTML=`
 <div class="tb"><s style="background:#ff5f57"></s><s style="background:#febc2e"></s><s style="background:#28c840"></s>
  <div class="tabs"><span>지금</span><span class="sel">이번 달</span><span>계정</span><span>구독</span></div><span style="width:52px"></span></div>
 <div class="wm">
  <div class="k">10월 1일 – 16일</div>
  <div class="headline serif">구독 네 개에 <em>₩235,000</em>. Claude는 꽉 차게 쓰고, Grok은 2주째 거의 쓰지 않았어요.</div>
  <div class="kpis">
   <div class="kpi"><div class="l">이번 달 구독료</div><div class="v num">₩235,000</div><div class="s">다음 결제 10월 20일 · Claude</div></div>
   <div class="kpi"><div class="l">한도가 바닥난 횟수</div><div class="v num">7번</div><div class="s">지난달보다 4번 적어요</div></div>
   <div class="kpi"><div class="l">거의 안 쓰는 구독</div><div class="v num" style="color:var(--warn)">1개</div><div class="s">SuperGrok · ₩41,000</div></div>
  </div>
  <div class="cols">
   <div class="box"><h4>구독 가치 <span style="font-weight:400;color:var(--dim);font-size:11px">— 받은 한도 중 쓴 만큼</span></h4>
    ${vals.map(v=>`<div class="vrow"><span class="dot" style="background:${v[1]}">${v[0][0]}</span><span>${v[0]}<div class="m">${v[4]}</div></span><span class="num" style="text-align:right;color:var(--dim)">${v[2]}</span><span class="num" style="text-align:right;font-weight:700;color:${v[3]<.1?'var(--warn)':'var(--ink)'}">${Math.round(v[3]*100)}%</span></div>`).join('')}
   </div>
   <div class="box"><h4>Tokta가 본 것</h4>
    <div class="note"><b>바닥나는 때</b>Claude 메인은 화·수 오후 2–5시에 5시간 한도가 바닥나요. 그때는 서브로 바꿔 쓰면 돼요.</div>
    <div class="note w"><b>아낄 수 있는 것</b>SuperGrok을 해지하면 한 달 ₩41,000을 아껴요.</div>
    <div class="note"><b>다음 결제</b>10월 20일 Claude Max ₩137,000.</div>
   </div>
  </div>
 </div>`;

document.getElementById('ob').innerHTML=`
 <div class="tb"><s style="background:#ff5f57"></s><s style="background:#febc2e"></s><s style="background:#28c840"></s></div>
 <div class="obm">
  <canvas class="px" width="16" height="16" style="width:64px;height:64px"></canvas>
  <div class="headline serif">쓰는 AI 구독을 연결해요</div>
  <p>로그인 정보는 이 Mac에만 남고, Tokta는 남은 한도만 읽어요.<br>계정이 여러 개면 하나씩 더 추가할 수 있어요.</p>
  <div class="steps"><b class="on"></b><b class="on"></b><b></b></div>
  <div style="margin-top:14px">
   <div class="svc"><span class="dot" style="background:#10a37f">C</span><span>ChatGPT<small>이 Mac의 Codex 로그인을 찾았어요 · Pro</small></span><span class="ok">연결됨 ✓</span></div>
   <div class="svc"><span class="dot" style="background:#d97757">C</span><span>Claude<small>Tokta 창에서 로그인 · Google 계정은 ‘이메일로 계속하기’</small></span><span class="go">연결 →</span></div>
   <div class="svc"><span class="dot" style="background:#1d1d1f">C</span><span>Cursor<small>Grok Bot 한도도 함께 보여요</small></span><span class="go">연결 →</span></div>
   <div class="svc"><span class="dot" style="background:#6b6b73">G</span><span>Grok<small>Grok CLI가 필요해요 · 설치 명령 복사</small></span><span class="go">설치 →</span></div>
   <div class="svc"><span class="dot" style="background:#4285f4">A</span><span>Antigravity<small>설치돼 있지 않아요</small></span><span style="font-size:12px;color:var(--dim)">건너뛰기</span></div>
  </div>
  <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)"><span>나중에 설정 → 계정에서 바꿀 수 있어요</span><span class="btn" style="margin:0">다음 — 알림 받을 곳</span></div>
 </div>`;

function sprite(cv){const ctx=cv.getContext('2d');const C={frame:'#2a2c3a',title:'#3a3d50',red:'#ff5f57',yel:'#febc2e',grn:'#28c840',screen:'#1b1c26',fill:'#8b8ff8',fl:'#e8e9f0',fd:'#15161c'};
 const p=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,1,1)};
 for(let y=1;y<=14;y++)for(let x=0;x<16;x++)if(!((x===0||x===15)&&(y===1||y===14)))p(x,y,C.frame);
 for(let x=1;x<=14;x++){p(x,2,C.title);p(x,3,C.title)}[[2,C.red],[4,C.yel],[6,C.grn]].forEach(([x,c])=>{p(x,2,c);p(x,3,c)});
 const lv=14-Math.round(9*.6);for(let y=5;y<=13;y++)for(let x=1;x<=14;x++)p(x,y,y>=lv?C.fill:C.screen);
 [[4,8],[5,7],[6,8],[9,8],[10,7],[11,8],[7,10],[8,10],[9,10],[13,10]].forEach(([x,y])=>p(x,y,y>=lv?C.fd:C.fl));}
document.querySelectorAll('canvas.px').forEach(sprite);
</script></body></html>
